global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:3000"]
    metrics_path: /metrics

  - job_name: "orders"
    static_configs:
      - targets: ["orders:3001"]
    metrics_path: /metrics

  - job_name: "payments"
    static_configs:
      - targets: ["payments:3002"]
    metrics_path: /metrics

  - job_name: "stock"
    static_configs:
      - targets: ["stock:3003"]
    metrics_path: /metrics
