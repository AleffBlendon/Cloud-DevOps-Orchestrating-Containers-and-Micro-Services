---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: lojaveloz
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "gateway"
        static_configs:
          - targets: ["gateway:3000"]
        metrics_path: /metrics

      - job_name: "orders"
        static_configs:
          - targets: ["orders:3001"]
        metrics_path: /metrics

      - job_name: "payments"
        static_configs:
          - targets: ["payments:3002"]
        metrics_path: /metrics

      - job_name: "stock"
        static_configs:
          - targets: ["stock:3003"]
        metrics_path: /metrics

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: lojaveloz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: lojaveloz
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
