---
# ─────────────────────────────────────────────────────────────────────────────
# Deployment – Stock Service
# Rolling Update strategy for zero-downtime deployments.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock
  namespace: lojaveloz
  annotations:
    kubernetes.io/change-cause: "Initial deployment"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stock
    spec:
      containers:
        - name: stock
          image: cloud-devops-stock:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          env:
            - name: PORT
              value: "3003"
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "250m"
              memory: "256Mi"

---
# ─────────────────────────────────────────────────────────────────────────────
# Service – Stock (ClusterIP)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: stock
  namespace: lojaveloz
spec:
  selector:
    app: stock
  ports:
    - port: 3003
      targetPort: 3003
