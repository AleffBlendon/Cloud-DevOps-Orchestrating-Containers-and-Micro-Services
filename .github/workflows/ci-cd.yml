name: CI/CD – Loja Veloz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/lojaveloz

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Build & test each service
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build – ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, orders, payments, stock]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm ci

      # Add your test command here when you have tests
      # - name: Run tests
      #   working-directory: services/${{ matrix.service }}
      #   run: npm test

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Docker build & push (only on main branch)
  # ────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker – ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [gateway, orders, payments, stock]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          file:    services/${{ matrix.service }}/Dockerfile
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Deploy to Kubernetes (only on main branch)
  #
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.30.0"

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: lojaveloz
          kubectl_version: v1.30.0

      - name: Apply namespace, configmap, and secret
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml

      - name: Deploy infrastructure (postgres, rabbitmq)
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/rabbitmq.yaml

      - name: Build and load images into kind
      
        run: |
          docker build -t lojaveloz-gateway:latest  services/gateway
          docker build -t lojaveloz-orders:latest   services/orders
          docker build -t lojaveloz-payments:latest services/payments
          docker build -t lojaveloz-stock:latest    services/stock

          kind load docker-image lojaveloz-gateway:latest  --name lojaveloz
          kind load docker-image lojaveloz-orders:latest   --name lojaveloz
          kind load docker-image lojaveloz-payments:latest --name lojaveloz
          kind load docker-image lojaveloz-stock:latest    --name lojaveloz

      - name: Deploy application services
        run: |
          kubectl apply -f k8s/gateway.yaml
          kubectl apply -f k8s/orders.yaml
          kubectl apply -f k8s/payments.yaml
          kubectl apply -f k8s/stock.yaml

      - name: Apply HPA
        run: kubectl apply -f k8s/hpa-orders.yaml

      - name: Deploy observability stack
        run: |
          kubectl apply -f k8s/prometheus.yaml
          kubectl apply -f k8s/grafana.yaml

      - name: Verify deployments exist
        run: |
          kubectl get deployment gateway  -n lojaveloz
          kubectl get deployment orders   -n lojaveloz
          kubectl get deployment payments -n lojaveloz
          kubectl get deployment stock    -n lojaveloz

      - name: Verify deployments
        run: kubectl get pods -n lojaveloz
